# ING Estructural — dos sitios desde este repositorio (sin compilación):
#   mesa-ing.netlify.app  → publica la raíz (Mesa de Cálculo)
#   power-ing.netlify.app → publica la carpeta power/ (POWER)
# La carpeta a publicar se define en la configuración de cada sitio en Netlify, no aquí.
# La página y el service worker no se guardan en caché del navegador: así cada dispositivo detecta las versiones nuevas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
