<script>/* ==========================================================================
   POWER en la nube (Supabase) — adaptador con la misma interfaz mínima que la
   base de datos de claude.ai: collection(c).onSnapshot(cb) · doc(id).set(data) · doc(id).delete().
   Tabla public.docs (owner, col, id, data jsonb, updated_at) con seguridad por fila (cada usuario ve solo lo suyo).
   - Inicio de sesión con correo y contraseña (sesión guardada en este dispositivo, se renueva sola).
   - Copia local de los datos para abrir sin conexión; los cambios hechos sin conexión quedan en cola y se
     envían al volver internet. Sincroniza cada 20 s con la app abierta y al volver a ella.
   ========================================================================== */
(() => {
  const CFG = window.PW_CFG || {};
  if (!CFG.url || !CFG.key) return;
  const LS = { get: k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  const K_SESS = 'pw_sess', K_CACHE = 'pw_cache', K_Q = 'pw_queue';
  let sess = LS.get(K_SESS), cache = LS.get(K_CACHE) || {}, queue = LS.get(K_Q) || [];
  const listeners = {};       // col -> [cb]
  let status = 'ok', lastSync = null, timer = null, flushing = false;

  const hdr = (auth) => { const h = {apikey: CFG.key, 'Content-Type': 'application/json'}; if (auth && sess) h.Authorization = 'Bearer ' + sess.access_token; return h; };
  async function authCall(grant, body) {
    const r = await fetch(`${CFG.url}/auth/v1/token?grant_type=${grant}`, {method: 'POST', headers: hdr(false), body: JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || ('Error ' + r.status));
    sess = {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Date.now()/1000 + (j.expires_in || 3600)), user: {id: j.user && j.user.id, email: j.user && j.user.email}};
    LS.set(K_SESS, sess); return sess;
  }
  async function ensureToken() {
    if (!sess) throw Object.assign(new Error('Sin sesión'), {code: 'auth'});
    if (sess.expires_at - Date.now()/1000 < 90) {
      try { await authCall('refresh_token', {refresh_token: sess.refresh_token}); }
      catch (e) { if (navigator.onLine) { sess = null; LS.set(K_SESS, null); throw Object.assign(new Error('La sesión expiró'), {code: 'auth'}); } throw e; }
    }
  }
  async function rest(method, path, body, prefer) {
    await ensureToken();
    const h = hdr(true); if (prefer) h.Prefer = prefer;
    const r = await fetch(`${CFG.url}/rest/v1/${path}`, {method, headers: h, body: body ? JSON.stringify(body) : undefined});
    if (r.status === 401) { sess = null; LS.set(K_SESS, null); throw Object.assign(new Error('La sesión expiró'), {code: 'auth'}); }
    if (!r.ok) { const t = await r.text().catch(() => ''); throw Object.assign(new Error(t || ('Error ' + r.status)), {code: 'http' + r.status}); }
    return method === 'GET' ? r.json() : null;
  }
  function emit(col) {
    const arr = Object.entries(cache[col] || {}).map(([id, data]) => ({id, data: () => data}));
    (listeners[col] || []).forEach(cb => { try { cb({docs: arr}); } catch (e) { console.error(e); } });
  }
  function setStatus(s) { status = s; const el = document.getElementById('pwSync'); if (!el) return;
    const q = queue.length;
    el.textContent = s === 'offline' ? `⚠ Sin conexión${q ? ' · ' + q + ' cambio(s) por enviar' : ' · usando copia local'}` : s === 'sync' ? '⟳ Sincronizando…' : q ? `⏳ ${q} cambio(s) por enviar` : '☁ Sincronizado';
    el.className = 'pwsync ' + (s === 'offline' ? 'off' : q ? 'pend' : 'ok'); el.title = lastSync ? 'Última sincronización: ' + new Date(lastSync).toLocaleTimeString('es-CL') : ''; }
  async function pull() {
    if (!sess) return;
    const all = {}; let from = 0; const step = 1000;
    for (;;) {
      const rows = await rest('GET', `docs?select=col,id,data&order=col.asc,id.asc&offset=${from}&limit=${step}`);
      rows.forEach(r => { (all[r.col] = all[r.col] || {})[r.id] = r.data; });
      if (rows.length < step) break; from += step;
    }
    // los cambios aún en cola se superponen a lo que viene de la nube
    queue.forEach(op => { const m = (all[op.col] = all[op.col] || {}); if (op.op === 'set') m[op.id] = op.data; else delete m[op.id]; });
    const changed = new Set([...Object.keys(all), ...Object.keys(cache)]);
    const prev = JSON.stringify(cache); cache = all; LS.set(K_CACHE, cache); lastSync = Date.now();
    if (JSON.stringify(cache) !== prev) changed.forEach(emit);
  }
  async function flush() {
    if (flushing || !queue.length || !sess) return; flushing = true;
    try {
      while (queue.length) {
        // agrupa los «set» consecutivos en un solo envío
        const op = queue[0];
        if (op.op === 'set') {
          const batch = []; for (const o of queue) { if (o.op !== 'set' || batch.length >= 200) break; batch.push(o); }
          await rest('POST', 'docs?on_conflict=owner,col,id', batch.map(o => ({owner: sess.user.id, col: o.col, id: o.id, data: o.data, updated_at: new Date().toISOString()})), 'resolution=merge-duplicates,return=minimal');
          queue.splice(0, batch.length);
        } else {
          await rest('DELETE', `docs?col=eq.${encodeURIComponent(op.col)}&id=eq.${encodeURIComponent(op.id)}`);
          queue.shift();
        }
        LS.set(K_Q, queue);
      }
    } finally { flushing = false; }
  }
  async function sync() {
    if (!sess) return;
    if (!navigator.onLine) return setStatus('offline');
    try { setStatus('sync'); await flush(); await pull(); setStatus('ok'); }
    catch (e) { if (e.code === 'auth') { showLogin('Su sesión expiró. Ingrese nuevamente.'); return; } setStatus(navigator.onLine ? 'offline' : 'offline'); console.warn('sync', e); }
  }
  function enqueue(op) {
    queue = queue.filter(o => !(o.col === op.col && o.id === op.id)); queue.push(op); LS.set(K_Q, queue);
    const m = (cache[op.col] = cache[op.col] || {}); if (op.op === 'set') m[op.id] = op.data; else delete m[op.id];
    LS.set(K_CACHE, cache); emit(op.col); setStatus(status);
    sync();
  }
  const db = {
    collection(col) {
      return {
        onSnapshot(cb) { (listeners[col] = listeners[col] || []).push(cb); setTimeout(() => emit(col), 0); return () => {}; },
        doc(id) { return {
          async set(data) { enqueue({op: 'set', col, id, data: JSON.parse(JSON.stringify(data))}); },
          async delete() { enqueue({op: 'del', col, id}); } }; }
      };
    },
    async bulkSet(rows) { rows.forEach(r => { queue = queue.filter(o => !(o.col === r.col && o.id === r.id)); queue.push({op: 'set', col: r.col, id: r.id, data: r.data}); const m = (cache[r.col] = cache[r.col] || {}); m[r.id] = r.data; });
      LS.set(K_Q, queue); LS.set(K_CACHE, cache); Object.keys(listeners).forEach(emit); await sync(); if (queue.length) throw new Error('Quedaron ' + queue.length + ' cambios por enviar (sin conexión)'); }
  };

  /* ---------------- pantalla de ingreso ---------------- */
  let loginResolve = null;
  function showLogin(msg) {
    let ov = document.getElementById('pwLogin');
    if (!ov) { ov = document.createElement('div'); ov.id = 'pwLogin'; document.body.appendChild(ov); }
    const logo = document.querySelector('img.logo');
    ov.innerHTML = `<div class="pwl-box">${logo ? `<img src="${logo.src}" alt="ING Estructural" class="pwl-logo">` : ''}
      <h2>POWER</h2><p class="pwl-sub">Administración ING Estructural — ingrese con su cuenta</p>
      <form id="pwlForm"><label>Correo<input id="pwlMail" type="email" autocomplete="username" required value="${(sess && sess.user && sess.user.email) || (LS.get('pw_mail') || '')}"></label>
      <label>Contraseña<input id="pwlPass" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="pwlGo">Entrar</button><div class="pwl-err" id="pwlErr">${msg || ''}</div></form></div>`;
    ov.hidden = false;
    ov.querySelector('#pwlForm').onsubmit = async e => { e.preventDefault(); const b = ov.querySelector('#pwlGo'), er = ov.querySelector('#pwlErr');
      b.disabled = true; er.textContent = 'Ingresando…';
      try { const mail = ov.querySelector('#pwlMail').value.trim(); await authCall('password', {email: mail, password: ov.querySelector('#pwlPass').value}); LS.set('pw_mail', mail);
        const firstUser = LS.get('pw_owner'); if (firstUser && firstUser !== sess.user.id) { cache = {}; queue = []; LS.set(K_CACHE, cache); LS.set(K_Q, queue); }
        LS.set('pw_owner', sess.user.id);
        ov.hidden = true; if (loginResolve) { loginResolve(); loginResolve = null; } await sync(); Object.keys(listeners).forEach(emit); }
      catch (err) { er.textContent = /invalid/i.test(err.message) ? 'Correo o contraseña incorrectos.' : !navigator.onLine ? 'Sin conexión: para ingresar la primera vez necesita internet.' : 'No se pudo ingresar: ' + err.message; b.disabled = false; } };
    setTimeout(() => { const p = ov.querySelector(sess ? '#pwlPass' : '#pwlMail'); p && p.focus(); }, 50);
  }
  function logout() { if (queue.length && !confirm('Hay ' + queue.length + ' cambio(s) sin enviar a la nube. ¿Salir igual? Se perderán.')) return;
    sess = null; LS.set(K_SESS, null); cache = {}; queue = []; LS.set(K_CACHE, cache); LS.set(K_Q, queue); location.reload(); }

  window.PW_CLOUD = {
    async db() {
      // barra de estado + salir, en la cabecera
      const hoy = document.getElementById('hoyBox');
      if (hoy && !document.getElementById('pwSync')) { const s = document.createElement('span'); s.id = 'pwSync'; s.className = 'pwsync ok'; hoy.appendChild(s);
        const o = document.createElement('button'); o.className = 'pwout'; o.textContent = 'Salir'; o.title = 'Cerrar sesión en este dispositivo'; o.onclick = logout; hoy.appendChild(o); }
      if (!sess) { await new Promise(res => { loginResolve = res; showLogin(); }); }
      else { setTimeout(() => sync(), 0); }
      setStatus(navigator.onLine ? 'ok' : 'offline');
      clearInterval(timer); timer = setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 20000);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
      window.addEventListener('online', sync); window.addEventListener('offline', () => setStatus('offline'));
      if (window.PW_LOCK) window.PW_LOCK.init();
      return db;
    },
    sync, logout, user: () => sess && sess.user,
    async checkPassword(pw) { const mail = sess && sess.user && sess.user.email; if (!mail) throw new Error('sin sesión'); await authCall('password', {email: mail, password: pw}); }
  };
})();
</script>
<script>/* ==========================================================================
   Bloqueo con Face ID / huella / Windows Hello (WebAuthn, autenticador del propio equipo).
   Se activa por equipo desde el botón 🔒 de la cabecera. Al abrir la app — o al volver a ella después
   de X minutos — tapa la pantalla y pide la verificación biométrica; alternativa: la contraseña.
   Es un bloqueo local de la pantalla (los datos siguen protegidos en la nube por el usuario y contraseña).
   ========================================================================== */
(() => {
  if (!window.PW_CLOUD) return;
  const K = 'pw_lock';
  const LS = { get: () => { try { return JSON.parse(localStorage.getItem(K) || 'null'); } catch (e) { return null; } },
               set: v => { try { v ? localStorage.setItem(K, JSON.stringify(v)) : localStorage.removeItem(K); } catch (e) {} } };
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const bioName = () => /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'Face ID / Touch ID' : /Windows/.test(navigator.userAgent) ? 'Windows Hello' : 'huella / reconocimiento facial';
  async function available() { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } }
  let locked = false, hiddenAt = 0;

  async function activar(minutos) {
    const u = (window.PW_CLOUD.user && window.PW_CLOUD.user()) || {};
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32), rp: { name: 'POWER — ING Estructural' },
      user: { id: rnd(16), name: u.email || 'power', displayName: 'POWER' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' },
      timeout: 60000 } });
    LS.set({ id: b64(cred.rawId), min: minutos });
  }
  async function verificar() {
    const L = LS.get(); if (!L) return true;
    const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(L.id) }], userVerification: 'required', timeout: 60000 } });
    return !!a;
  }
  function pantalla() {
    let ov = document.getElementById('pwLock');
    if (!ov) { ov = document.createElement('div'); ov.id = 'pwLock'; document.body.appendChild(ov); }
    const logo = document.querySelector('img.logo');
    ov.innerHTML = `<div class="pwk-box">${logo ? `<img src="${logo.src}" alt="ING Estructural" class="pwl-logo">` : ''}<h2>POWER</h2>
      <p class="pwl-sub">Bloqueado — use ${bioName()} para ver sus datos</p>
      <button class="btn" id="pwkGo">🔓 Desbloquear</button>
      <button class="btn ghost" id="pwkPass">Usar contraseña</button>
      <form id="pwkForm" hidden><label>Contraseña<input id="pwkIn" type="password" autocomplete="current-password"></label><button class="btn" type="submit">Entrar</button></form>
      <div class="pwl-err" id="pwkErr"></div></div>`;
    ov.hidden = false; locked = true; document.documentElement.classList.add('pw-locked');
    const err = t => ov.querySelector('#pwkErr').textContent = t;
    const abrir = () => { ov.hidden = true; locked = false; document.documentElement.classList.remove('pw-locked'); };
    ov.querySelector('#pwkGo').onclick = async () => { err(''); try { if (await verificar()) abrir(); } catch (e) { err(e.name === 'NotAllowedError' ? 'Verificación cancelada. Toque «Desbloquear» para intentar de nuevo.' : 'No se pudo verificar: ' + e.message); } };
    ov.querySelector('#pwkPass').onclick = () => { ov.querySelector('#pwkForm').hidden = false; ov.querySelector('#pwkIn').focus(); };
    ov.querySelector('#pwkForm').onsubmit = async e => { e.preventDefault(); err('Verificando…');
      try { await window.PW_CLOUD.checkPassword(ov.querySelector('#pwkIn').value); abrir(); }
      catch (er) { err(!navigator.onLine ? 'Sin conexión: use ' + bioName() + '.' : 'Contraseña incorrecta.'); } };
    // en PC/Android se puede pedir de inmediato; en iPhone/iPad hace falta tocar el botón
    if (!/iPhone|iPad|Macintosh/.test(navigator.userAgent)) setTimeout(() => ov.querySelector('#pwkGo').click(), 300);
  }
  function panel() {
    const L = LS.get();
    let ov = document.getElementById('pwLockCfg'); if (!ov) { ov = document.createElement('div'); ov.id = 'pwLockCfg'; document.body.appendChild(ov); }
    ov.innerHTML = `<div class="pwk-box"><h3>🔒 Bloqueo con ${bioName()}</h3>
      <p class="pwl-sub">${L ? 'Activado en este equipo.' : 'Pide ' + bioName() + ' para ver el POWER en este equipo (se activa por separado en cada equipo).'}</p>
      <label>Pedir de nuevo al volver a la app después de
        <select id="pwkMin"><option value="0">cada vez que se abre</option><option value="1">1 minuto</option><option value="5">5 minutos</option><option value="15">15 minutos</option><option value="60">1 hora</option></select></label>
      <div class="pwk-row">${L ? '<button class="btn" id="pwkSave">Guardar</button><button class="btn danger" id="pwkOff">Desactivar</button>' : '<button class="btn" id="pwkOn">Activar</button>'}<button class="btn ghost" id="pwkClose">Cerrar</button></div>
      <div class="pwl-err" id="pwkCfgErr"></div></div>`;
    ov.hidden = false;
    const sel = ov.querySelector('#pwkMin'); sel.value = String(L ? L.min : 5);
    const cerrar = () => { ov.hidden = true; };
    ov.querySelector('#pwkClose').onclick = cerrar; ov.onclick = e => { if (e.target === ov) cerrar(); };
    const on = ov.querySelector('#pwkOn'), off = ov.querySelector('#pwkOff'), sv = ov.querySelector('#pwkSave');
    if (on) on.onclick = async () => { const er = ov.querySelector('#pwkCfgErr');
      if (!(await available())) { er.textContent = 'Este equipo o navegador no tiene ' + bioName() + ' disponible para páginas web.'; return; }
      try { await activar(+sel.value); cerrar(); marcar(); toastL('Bloqueo activado en este equipo'); } catch (e) { er.textContent = e.name === 'NotAllowedError' ? 'Activación cancelada.' : 'No se pudo activar: ' + e.message; } };
    if (off) off.onclick = () => { LS.set(null); cerrar(); marcar(); toastL('Bloqueo desactivado en este equipo'); };
    if (sv) sv.onclick = () => { const L2 = LS.get(); if (L2) { L2.min = +sel.value; LS.set(L2); } cerrar(); toastL('Guardado'); };
  }
  function toastL(t) { try { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); } catch (e) {} }
  function marcar() { const b = document.getElementById('pwLockBtn'); if (b) { const on = !!LS.get(); b.textContent = on ? '🔒' : '🔓'; b.title = on ? 'Bloqueo con ' + bioName() + ': activado' : 'Activar bloqueo con ' + bioName(); } }

  window.PW_LOCK = {
    init() {
      const hoy = document.getElementById('hoyBox');
      if (hoy && !document.getElementById('pwLockBtn')) { const b = document.createElement('button'); b.id = 'pwLockBtn'; b.className = 'pwout'; b.onclick = panel; hoy.appendChild(b); marcar(); }
      if (LS.get()) pantalla();
      document.addEventListener('visibilitychange', () => {
        const L = LS.get(); if (!L) return;
        if (document.visibilityState === 'hidden') hiddenAt = Date.now();
        else if (!locked && hiddenAt && Date.now() - hiddenAt >= L.min * 60000) pantalla();
      });
    }
  };
})();
</script>

/* Libro de administración de oficina: cabecera sobria, pestañas tipo archivador, tablas contables densas.

:root{
  --bg:#f5f6f4; --panel:#ffffff; --ink:#1c2230; --muted:#5e6675; --line:#dfe2e6; --soft:#eef0f2;
  --ing:#1f3864; --ing-soft:#e3ebf6; --ga:#375623; --ga-soft:#e5efdc; --accent:#b4531f;
  --ok:#2f7d32; --ok-soft:#e1f1e1; --warn:#9a6700; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#fbe4e2; --grey-soft:#e7e7e7;
  --ff-d:"Archivo", "Helvetica Neue", Arial, sans-serif; --ff-b:"Source Sans 3", "Segoe UI", Arial, sans-serif; --ff-m:"IBM Plex Mono", ui-monospace, Consolas, monospace;

}

  --ok:#7fcf83; --ok-soft:#1b3320; --warn:#e6b650; --warn-soft:#3a2f14; --bad:#f2837a; --bad-soft:#3d1c1a; --grey-soft:#2a2d33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1e26; --ink:#e7e9ee; --muted:#9aa2b1; --line:#2c323d; --soft:#222733;
  --ing:#8fb1e6; --ing-soft:#1c2a42; --ga:#9ccc7a; --ga-soft:#1f2e19; --accent:#e58a55;
  --ok:#7fcf83; --ok-soft:#1b3320; --warn:#e6b650; --warn-soft:#3a2f14; --bad:#f2837a; --bad-soft:#3d1c1a; --grey-soft:#2a2d33; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:15px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand h1{font-family:var(--ff-d);font-weight:800;font-size:1.55rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.who{display:flex;gap:10px;flex-wrap:wrap}
.who span{font-family:var(--ff-d);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:3px}
.who .i{background:var(--ing-soft);color:var(--ing)} .who .g{background:var(--ga-soft);color:var(--ga)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0 6px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:10px 14px;border-radius:4px;min-width:0}
.kpi b{display:block;font-family:var(--ff-m);font-size:1.15rem;font-variant-numeric:tabular-nums;font-weight:600}
.kpi small{color:var(--muted);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;font-family:var(--ff-d);font-weight:600}
.kpi.i{border-top:3px solid var(--ing)} .kpi.g{border-top:3px solid var(--ga)} .kpi.a{border-top:3px solid var(--accent)}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-top:18px;border-bottom:1px solid var(--line)}
nav.tabs button{font-family:var(--ff-d);font-weight:600;font-size:.9rem;border:1px solid transparent;border-bottom:none;background:none;color:var(--muted);padding:9px 14px;cursor:pointer;border-radius:4px 4px 0 0;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line)}
nav.tabs button.ti[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--ing)} nav.tabs button.tg[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--ga)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.pane{background:var(--panel);border:1px solid var(--line);border-top:none;padding:16px;border-radius:0 0 4px 4px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1 1 200px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;min-width:0}
textarea{resize:vertical}
button.btn{font-family:var(--ff-d);font-weight:600;font-size:.88rem;border:1px solid var(--ink);background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:3px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.btn.i{background:var(--ing);border-color:var(--ing);color:#fff} button.btn.g{background:var(--ga);border-color:var(--ga);color:#fff}
:root[data-theme="dark"] button.btn.i,:root[data-theme="dark"] button.btn.g{color:#10131a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.btn.i,:root:not([data-theme="light"]) button.btn.g{color:#10131a}}
button.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-family:var(--ff-d);font-weight:600;font-size:.74rem;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:8px;background:var(--soft);color:var(--muted);white-space:nowrap;position:sticky;top:0}
th.i{background:var(--ing);color:#fff} th.g{background:var(--ga);color:#fff}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--ff-m);font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--ff-m);font-weight:600;white-space:nowrap}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--soft)}
tr.cancel td{color:var(--muted);text-decoration:line-through;background:var(--grey-soft)}
tr.cancel td.keep{text-decoration:none}
tr.tot td{font-weight:700;border-top:2px solid var(--ink);background:var(--soft)}
.pill{display:inline-block;font-family:var(--ff-d);font-weight:600;font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:10px;white-space:nowrap;text-decoration:none}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-grey{background:var(--grey-soft);color:var(--muted)} .p-i{background:var(--ing-soft);color:var(--ing)} .p-g{background:var(--ga-soft);color:var(--ga)}
.late{color:var(--bad);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.82rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.two>*{min-width:0}
h2{font-family:var(--ff-d);font-weight:700;font-size:1.05rem;margin:4px 0 10px}
h2.i{color:var(--ing)} h2.g{color:var(--ga)}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:3px}
.kv>div{padding:7px 10px;border-top:1px solid var(--line)} .kv>div:nth-child(-n+2){border-top:none}
.kv .v{text-align:right;font-family:var(--ff-m);font-variant-numeric:tabular-nums}
.kv .res{font-weight:700;background:var(--ga-soft)}
.kv input{width:150px;text-align:right;font-family:var(--ff-m)}
.note{font-size:.82rem;color:var(--muted);margin-top:10px;max-width:80ch}
/* panel de edición */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--panel);width:min(560px,100%);height:100%;overflow-y:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));border-left:4px solid var(--ink)}
.drawer.i{border-left-color:var(--ing)} .drawer.g{border-left-color:var(--ga)}
.drawer h3{font-family:var(--ff-d);font-weight:700;margin:0 0 4px;font-size:1.15rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{font-size:.95rem;color:var(--ink);font-weight:400}
.calc{grid-column:1/-1;background:var(--soft);border-radius:3px;padding:10px;font-family:var(--ff-m);font-size:.85rem;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-variant-numeric:tabular-nums}
.calc span:nth-child(even){text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:space-between}
.err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:4px;font-size:.9rem;z-index:30}
.filebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.filebar .where{flex:1 1 260px;min-width:0;font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.filebar .where b{color:var(--ink);font-family:var(--ff-m);font-weight:600}
.dirty{color:var(--warn);font-weight:700}
.fslist{border:1px solid var(--line);border-radius:3px;margin-top:10px}
.fslist .it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line)}
.fslist .it:first-child{border-top:none}
.fslist .it .nm{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.fslist .it.cur{background:var(--ing-soft)}
.fslist .ic{font-family:var(--ff-m);font-size:.75rem;color:var(--muted);width:3.2em}
.mode{font-size:.8rem;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:3px;margin-top:10px}
@media (max-width:560px){.form{grid-template-columns:1fr}.brand h1{font-size:1.3rem}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

/* Compacto: pestañas y encabezados destacados, tabla visible completa */
.wrap{max-width:1720px;padding-block:12px 40px}
nav.tabs{background:var(--ink);padding:5px 6px 0;margin-top:12px;border-radius:4px 4px 0 0;border-bottom:none;gap:3px}
nav.tabs button{color:var(--panel);opacity:.78;padding:7px 12px;font-size:.86rem}
nav.tabs button:hover{opacity:1}
nav.tabs button[aria-selected="true"]{opacity:1;background:var(--panel);color:var(--ink);border-color:var(--panel)}
section.pane{padding:10px 12px}
table{font-size:.8rem}
th{background:var(--ing);color:#fff;font-weight:700;font-size:.66rem;letter-spacing:.02em;padding:6px 5px;white-space:normal;vertical-align:bottom;line-height:1.2}
th.n{font-family:var(--ff-d)}
th.g{background:var(--ga)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{color:#10131a}}
:root[data-theme="dark"] th{color:#10131a}
td{padding:4px 5px}
td.code{font-size:.72rem}
td.n{font-size:.74rem}
.pill{font-size:.64rem;padding:1px 6px}
.kpi{padding:6px 12px} .kpi b{font-size:1.05rem}

.drawer.g .pinfo{border-left-color:var(--ga)}
.pinfo .pi-h{font-weight:700;margin-bottom:4px}
.pinfo dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.pinfo dt{color:var(--muted)} .pinfo dd{margin:0;overflow-wrap:anywhere}
.pinfo dd.n{font-family:var(--ff-m);font-variant-numeric:tabular-nums}
.pinfo .warn,.calc .warn{color:var(--warn);font-weight:600;margin:4px 0 0}
button.btn.mini{padding:1px 8px;font-size:.72rem;margin-left:6px}
.fstree{border:1px solid var(--line);border-radius:3px;margin-top:10px;font-size:.88rem}
.fstree .tr{display:flex;align-items:center;gap:6px;padding:4px 8px;border-top:1px solid var(--line)}
.fstree>.tn>.tr:first-child{border-top:none}
.fstree .tr .nm{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.fstree .tr .nm:hover{text-decoration:underline}
.fstree .tr.act{background:var(--ing-soft);font-weight:700}
.fstree .tr.file{color:var(--muted)} .fstree .tr.file.cur{color:var(--ink);font-weight:600}
.brandrow{display:flex;align-items:center;gap:16px;min-width:0;flex-wrap:wrap}
.brandrow .logo{height:62px;width:auto;background:#fff;border-radius:4px;padding:4px 6px;display:block}
@media (max-width:560px){.brandrow .logo{height:46px}}
.newcli{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--soft);border-left:3px solid var(--accent);padding:8px 10px;border-radius:3px}
.newcli[hidden]{display:none}
.form label.chk{flex-direction:row;align-items:center;gap:6px;grid-column:1/-1;font-weight:400;color:var(--ink)}
.refs{grid-column:1/-1;display:grid;align-items:end;grid-template-columns:repeat(4,1fr);gap:8px;border:1px dashed var(--line);border-radius:3px;padding:6px 8px 8px}

.refl{display:block;font-size:.68rem;color:var(--muted);font-family:var(--ff-m)}

.ctiles>div{background:var(--soft);border-radius:4px;padding:8px 12px;border-top:3px solid var(--ing)}
.ctiles>div.ok{border-top-color:var(--ok)} .ctiles>div.wa{border-top-color:var(--warn)}
.ctiles small{display:block;font-family:var(--ff-d);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}

.fstree .tr.proy .code{font-size:.74rem;font-weight:600}

.fstree .ext{font-family:var(--ff-m);font-size:.64rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}

.carp .btn.mini{justify-self:start;margin-left:0}
.fstree .tr.proy.link{background:var(--ing-soft)}

.carp .full{grid-column:1/-1}

/* ---- Colores vivos para barras e identificaciones (ING azul marino y G. Aguilera verde se mantienen) + fondos tenues de orientación ---- */
:root{
  --bar:#0b7285; --bar-2:#0e8fa6; --bar-ink:#ffffff; --th:#0b7285;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#c2410c; --warn-soft:#ffedd5; --bad:#dc2626; --bad-soft:#fee2e2;

:root[data-theme="dark"]{

  --blue:#93b4ff; --blue-soft:#1b2a4d; --cyan:#67d4e6; --cyan-soft:#10313a; --vio:#c4a5ff; --vio-soft:#2a1f47; --grey-ink:#a3adbd; --grey-soft:#2a303a;

body{background:var(--bg)}
nav.tabs{background:linear-gradient(90deg,var(--bar),var(--bar-2))}
nav.tabs button{color:var(--bar-ink);opacity:.85}
nav.tabs button[aria-selected="true"]{color:var(--bar);background:var(--panel);border-color:var(--panel)}
nav.tabs button.ti[aria-selected="true"]{color:var(--ing)} nav.tabs button.tg[aria-selected="true"]{color:var(--ga)}
th{background:var(--th);color:#fff}
th.i{background:var(--ing)} th.g{background:var(--ga)}

:root[data-theme="dark"] th:not(.i):not(.g){color:#fff}

.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-grey{background:var(--grey-soft);color:var(--grey-ink)}

.drawer{border-left-color:var(--bar)} .drawer.i{border-left-color:var(--ing)} .drawer.g{border-left-color:var(--ga)}
.drawer h3{color:var(--bar)} .drawer.i h3{color:var(--ing)} .drawer.g h3{color:var(--ga)}

.carp{border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 5%,var(--panel))}

<script>
(() => {
'use strict';
/* ------------------------------------------------------------------ utilidades */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clp = n => (n == null || isNaN(n)) ? '—' : (n < 0 ? '−' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('es-CL');
const uf = n => (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('es-CL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = n => (n == null || isNaN(n)) ? '—' : (n * 100).toLocaleString('es-CL', {maximumFractionDigits: 2}) + '%';
const fdate = s => s ? s.split('-').reverse().join('-') : '';
const today = () => new Date().toISOString().slice(0, 10);
const num = v => { const x = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); return isNaN(x) ? null : x; };
const numIn = v => { if (v === '' || v == null) return null; const s = String(v).trim(); const x = /,/.test(s) ? parseFloat(s.replace(/\./g, '').replace(',', '.')) : parseFloat(s); return isNaN(x) ? null : x; };
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const ESTADOS_DOC = ['Pendiente','Pagada','Pago parcial','Vencida','Anulada'];
const ESTADOS_PROY = ['En oferta','Adjudicado','En ejecución','Entregado','Solicitar HES/WE/HAS','Facturado','Pagado','Terminado','Suspendido','Cancelado','No adjudicado'];
const MOTIVOS = ['Detenido por el mandante','No se ejecutó','Detenido por ING Estructural','Otro (ver observaciones)'];
const DEF_PARAMS = { iva: 0.19, ufRef: 41040.82, uta: 834504, gp: 0.30, gpTope: 15, semRojo: 3, semAmarillo: 10,
  rates: {2024: 0.1375, 2025: 0.145, 2026: 0.1525, 2027: 0.16, 2028: 0.17},
  igc: [[0,0,0],[13.5,0.04,0.54],[30,0.08,1.74],[50,0.135,4.49],[70,0.23,11.14],[90,0.304,17.8],[120,0.35,23.32],[310,0.40,38.82]] };

/* ------------------------------------------------------------------ estado */
const S = { clientes: [], proyectos: [], facturas: [], boletas: [], params: {...DEF_PARAMS}, imp: {},
  tab: 'proyectos', q: '', fEstado: '', fDoc: '', resYear: new Date().getFullYear(), resCli: 'Todos', impYear: new Date().getFullYear(), loaded: {} };
try { const t = localStorage.getItem('ing_tab'); if (t) S.tab = t; } catch (e) {}

/* ------------------------------------------------------------------ almacenamiento: db compartida o modo local */
let db = null, downloads = null, LOCAL = false;
const COLS = ['clientes','proyectos','facturas','boletas'];
const CLIENTES_BASE = [];
function localLoad() {
  S.clientes = CLIENTES_BASE.map((n, i) => ({id: 'c' + String(i + 1).padStart(2, '0'), nombre: n, siglaManual: ''}));
  try { const raw = localStorage.getItem('ing_admin_local'); if (raw) { const o = JSON.parse(raw); COLS.forEach(c => { if (o[c] && (c !== 'clientes' || o[c].length)) S[c] = o[c]; }); S.params = {...DEF_PARAMS, ...(o.params||{})}; S.imp = o.imp || {}; } } catch (e) {}
}
function localSave() { FS.dirty = true; fsBar(); if (FS.auto && FS.file) fsSaveSoon(); try { localStorage.setItem('ing_admin_local', JSON.stringify({clientes:S.clientes,proyectos:S.proyectos,facturas:S.facturas,boletas:S.boletas,params:S.params,imp:S.imp})); } catch (e) {} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
async function put(col, id, data) {
  if (LOCAL) { const arr = S[col]; const i = arr.findIndex(x => x.id === id); const rec = {...data, id}; if (i >= 0) arr[i] = rec; else arr.push(rec); localSave(); render(); return; }
  await db.collection(col).doc(id).set(data);
}
async function del(col, id) {
  if (LOCAL) { S[col] = S[col].filter(x => x.id !== id); localSave(); render(); return; }
  await db.collection(col).doc(id).delete();
}
async function putConfig(id, data) {
  if (LOCAL) { if (id === 'params') S.params = {...DEF_PARAMS, ...data}; else S.imp[id] = data; localSave(); render(); return; }
  await db.collection('config').doc(id).set(data);
}
/* ------------------------------------------------------------------ carpeta y archivos (modo local, File System Access) */
const FS = { supported: typeof window.showDirectoryPicker === 'function', dir: null, path: [], file: null, fileName: '', dirty: false, auto: false, t: null, open: new Set(['/']), closed: new Set(), openAll: false };
try { const o = JSON.parse(localStorage.getItem('ing_fs_open') || 'null'); if (Array.isArray(o)) FS.open = new Set(['/', ...o]); } catch (e) {}
try { FS.auto = localStorage.getItem('ing_fs_auto') === '1'; } catch (e) {}
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('ing_fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('h'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v) { try { const d = await idb(); await new Promise((res, rej) => { const tx = d.transaction('h', 'readwrite'); tx.objectStore('h').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) {} }
async function idbGet(k) { try { const d = await idb(); return await new Promise((res) => { const tx = d.transaction('h'); const r = tx.objectStore('h').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch (e) { return null; } }
const snapshotData = () => JSON.stringify({app: 'POWER — ING Estructural', version: 1, guardado: new Date().toISOString(), clientes: S.clientes, proyectos: S.proyectos, facturas: S.facturas, boletas: S.boletas, params: S.params, imp: S.imp}, null, 1);
function loadData(o) { COLS.forEach(c => { if (Array.isArray(o[c]) && (c !== 'clientes' || o[c].length)) S[c] = o[c]; else if (c !== 'clientes') S[c] = []; }); S.params = {...DEF_PARAMS, ...(o.params || {})}; S.imp = o.imp || {}; try { localStorage.setItem('ing_admin_local', snapshotData()); } catch (e) {} }
const curDir = () => FS.path.length ? FS.path[FS.path.length - 1] : FS.dir;
const dirLabel = () => FS.dir ? [FS.dir.name, ...FS.path.map(d => d.name)].join(' / ') : '';
function fsBar() {
  const w = $('#fbWhere'); if (!w) return;
  if (!FS.supported) { w.innerHTML = 'Este navegador no permite elegir carpetas: "Guardar como" descarga el archivo y "Carpeta…" abre un archivo guardado. Use Chrome o Edge para trabajar con carpetas.'; }
  else w.innerHTML = (FS.dir ? `Carpeta activa: <b>${esc(dirLabel())}</b>` : 'Sin carpeta elegida') + ' · ' + (FS.file ? `Archivo: <b id="fbFileLoc">${esc(FS.fileName)}</b>` : 'sin archivo') + (FS.dirty ? ' · <span class="dirty">cambios sin guardar</span>' : (FS.file ? ' · guardado' : ''));
  if (FS.file && FS.dir) FS.dir.resolve(FS.file).then(arr => { const b = document.getElementById('fbFileLoc'); if (b && arr) b.textContent = [FS.dir.name, ...arr].join(' / '); }).catch(() => {});
  $('#fbSave').disabled = !FS.file && FS.supported;
  $('#fbAuto').checked = FS.auto;
}
async function ensurePerm(h) { try { if ((await h.queryPermission({mode: 'readwrite'})) === 'granted') return true; return (await h.requestPermission({mode: 'readwrite'})) === 'granted'; } catch (e) { return false; } }
async function fsWrite(handle) { const w = await handle.createWritable(); await w.write(snapshotData()); await w.close(); }
async function fsSave() {
  if (!FS.supported) return fsSaveAs();
  if (!FS.file) return fsSaveAs();
  try { if (!(await ensurePerm(FS.file))) return toast('Sin permiso para escribir el archivo'); await fsWrite(FS.file); FS.dirty = false; fsBar(); toast('Guardado en ' + FS.fileName); }
  catch (e) { toast('No se pudo guardar: ' + e.message); }
}
function fsSaveSoon() { clearTimeout(FS.t); FS.t = setTimeout(fsSave, 1200); }
async function fsOpenFile(handle) {
  try { const f = await handle.getFile(); const o = JSON.parse(await f.text()); loadData(o); FS.file = handle; FS.fileName = handle.name; FS.dirty = false; await idbSet('file', handle); fsBar(); render(); toast('Abierto: ' + handle.name); closeEditor(); }
  catch (e) { toast('El archivo no es un registro válido'); }
}
const UP = v => String(v || '').toLocaleUpperCase('es-CL');
const TITLE = v => String(v || '').toLocaleLowerCase('es-CL').replace(/(^|[\s\-\/(.])(\p{L})/gu, (m, a, b) => a + b.toLocaleUpperCase('es-CL'));
const CAP1 = v => { const t = String(v || '').toLocaleLowerCase('es-CL'); return t.charAt(0).toLocaleUpperCase('es-CL') + t.slice(1); };
const liveCase = (inp, fx) => { if (!inp || !fx) return; inp.addEventListener('input', () => { const a = inp.selectionStart, b = inp.selectionEnd, v = fx(inp.value); if (v !== inp.value) { inp.value = v; try { inp.setSelectionRange(a, b); } catch (e) {} } }); };
function nameDialog(title, def, onOk, fx) {
  $('#overlayRoot').innerHTML = `<div class="overlay" id="ov"><div class="drawer" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>

function semaforo(p) {
  if (['Entregado','Solicitar HES/WE/HAS','Facturado','Terminado'].includes(p.estado)) return {c: 'ok', t: 'entregado'};
  if (['Cancelado','No adjudicado'].includes(p.estado)) return null;
  if (p.estado === 'Suspendido') return {c: 'gr', t: 'suspendido'};
  const d = diasA(p.entrega); if (d === null) return {c: 'gr', t: 'sin fecha'};
  const R = +P().semRojo || 3, A = +P().semAmarillo || 10;
  const t = d < 0 ? `atrasado ${-d} d` : d === 0 ? 'entrega hoy' : `faltan ${d} d`;
  return {c: d <= R ? 'r' : d <= A ? 'a' : 'v', t, d};

function cobroPend(p, m) {   // Entregado → FACTURAR · Solicitar HES/WE/HAS → SOLICITAR · Facturado → COBRAR · Terminado → lo que quede pendiente · Pagado → nada
  if (!['Entregado','Solicitar HES/WE/HAS','Facturado','Terminado'].includes(p.estado)) return null;
  const fact = Math.max(m.porFacturar, 0), pag = Math.max(m.porPagar, 0);

  if (p.estado === 'Entregado') return fact > 0.005 ? {tipo: 'fact', fact, pag: 0, t: uf(fact) + ' UF por facturar'} : (pag > 0.5 ? {tipo: 'cob', fact: 0, pag, t: clp(pag) + ' por cobrar'} : {tipo: 'fact', fact: 0, pag: 0, t: 'emitir factura / boleta'});

}

    rd.onload = () => { try { const o = JSON.parse(rd.result); COLS.forEach(c => S[c] = o[c] || []); S.params = {...DEF_PARAMS, ...(o.params||{})}; S.imp = o.imp || {}; localSave(); toast('Respaldo restaurado'); render(); } catch (e) { toast('El archivo no es un respaldo válido'); } }; rd.readAsText(f); };
  const ij = $('#importJson', pane); if (ij) ij.onchange = () => { const f = ij.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = async () => { let o; try { o = JSON.parse(rd.result); } catch (e) { return toast('El archivo no es un respaldo válido'); }
      const rows = []; COLS.forEach(c => (Array.isArray(o[c]) ? o[c] : []).forEach(r => { if (!r || !r.id) return; const {id, ...d} = r; rows.push({col: c, id: String(id), data: d}); }));
      if (o.params) rows.push({col: 'config', id: 'params', data: o.params});
      Object.entries(o.imp || {}).forEach(([k, v]) => rows.push({col: 'config', id: k, data: v}));
      const n = c => (o[c] || []).length;
      if (!rows.length) return toast('El archivo no trae datos');
      if (!confirm(`Importar ${n('proyectos')} proyectos, ${n('facturas')} facturas, ${n('boletas')} boletas y ${n('clientes')} clientes?\nLos registros con el mismo identificador se reemplazan; el resto se agrega.`)) return;
      try { if (db && db.bulkSet) await db.bulkSet(rows); else for (const r of rows) await db.collection(r.col).doc(r.id).set(r.data);
        toast('Datos importados: ' + rows.length + ' registros'); } catch (e) { toast('Importación incompleta: ' + (e.message || e.code)); } ij.value = ''; };
    rd.readAsText(f); };
  pane.querySelectorAll('[data-edit]').forEach(tr => tr.onclick = () => openEditor(tr.dataset.edit, tr.dataset.id));
  pane.querySelectorAll('[data-imp]').forEach(inp => inp.onchange = async () => {
    const k = 'imp' + S.impYear; const cur = {...(S.imp[k]||{})}; cur[inp.dataset.imp] = numIn(inp.value) || 0;

  pane.querySelectorAll('[data-sm]').forEach(inp => inp.onchange = async () => {
    const c = S.clientes.find(x => x.id === inp.dataset.sm); if (!c) return;

  pane.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, b));

async function act(a, b) {
  if (a === 'newProy') return openEditor('proyectos', null);
  if (a === 'newFac') return openEditor('facturas', null);
  if (a === 'newBol') return openEditor('boletas', null);
  if (a === 'csv') return exportCSV(b.dataset.what);
  if (a === 'backup') { const data = snapshotData(); const fn = `respaldo_POWER_ING_Estructural_${today()}.json`;
    if (downloads) { try { await downloads.save({filename: fn, data}); } catch (e) { if (e.code !== 'declined') toast('No se pudo descargar (' + e.code + ')'); } return; }
    try { const url = URL.createObjectURL(new Blob([data], {type:'application/json'})); const aEl = document.createElement('a'); aEl.href = url; aEl.download = fn; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); } catch (e) { toast('No se pudo descargar'); } return; }
  if (a === 'cliDirs') return fsClientDirs();
  if (a === 'addCli') { const inp = $('#newCli'); const n = inp.value.trim().toUpperCase(); if (!n) return;
    if (S.clientes.some(c => c.nombre.toUpperCase() === n)) return toast('Ese cliente ya existe');
    try { await put('clientes', uid(), {nombre: n, siglaManual: ''}); toast('Cliente agregado'); } catch (e) { toast('No se pudo guardar'); } return; }
  if (a === 'delCli') { try { await del('clientes', b.dataset.id); toast('Cliente eliminado'); } catch (e) { toast('No se pudo eliminar'); } return; }
  if (a === 'savePar') { const p = {...P(), rates: {...P().rates}};
    document.querySelectorAll('[data-par]').forEach(i => { const v = numIn(i.value); if (v != null) p[i.dataset.par] = v; });
    document.querySelectorAll('[data-rate]').forEach(i => { const v = numIn(i.value); if (v != null) p.rates[i.dataset.rate] = v; });
    try { await putConfig('params', p); toast('Parámetros guardados'); } catch (e) { toast('No se pudo guardar'); } }
}
