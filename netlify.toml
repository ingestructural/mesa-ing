# Mesa de Cálculo (raíz) y POWER (/power/) — ING Estructural. Sitio estático (sin compilación).
[build]
  publish = "."

# La página y el service worker no se guardan en caché del navegador: así cada dispositivo detecta las versiones nuevas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/power/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/power/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/power/"
  [headers.values]
    Cache-Control = "no-cache"
